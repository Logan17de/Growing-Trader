name: Oracle Demand Wake

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-lifecycle
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Ensure Oracle instance is running
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -euo pipefail

          get_state() {
            oci compute instance get \
              --instance-id "$OCI_INSTANCE_OCID" \
              --query 'data."lifecycle-state"' \
              --raw-output
          }

          wait_for_state() {
            local target="$1"
            local timeout_seconds="$2"
            local deadline=$((SECONDS + timeout_seconds))
            local current
            while (( SECONDS < deadline )); do
              current="$(get_state)"
              echo "OCI state while waiting for ${target}: ${current}"
              if [[ "$current" == "$target" ]]; then
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for Oracle to reach ${target}." >&2
            return 1
          }

          start_and_wait() {
            oci compute instance action \
              --instance-id "$OCI_INSTANCE_OCID" \
              --action START \
              --wait-for-state RUNNING \
              --max-wait-seconds 420 \
              --wait-interval-seconds 10 >/dev/null
          }

          state="$(get_state)"
          echo "Current OCI state: $state"
          case "$state" in
            RUNNING)
              echo "Oracle is already running."
              ;;
            STARTING)
              echo "Oracle is already starting; waiting for RUNNING."
              wait_for_state RUNNING 420
              ;;
            STOPPED)
              echo "Starting Oracle for shared VM demand..."
              start_and_wait
              ;;
            STOPPING)
              echo "Oracle is stopping; waiting for STOPPED before restarting."
              wait_for_state STOPPED 900
              start_and_wait
              ;;
            *)
              echo "Oracle is in unsupported lifecycle state: $state" >&2
              exit 1
              ;;
          esac

          final_state="$(get_state)"
          [[ "$final_state" == "RUNNING" ]] || {
            echo "Oracle did not reach RUNNING; final state: $final_state" >&2
            exit 1
          }
          echo "Oracle is RUNNING."

      - name: Summary
        run: |
          {
            echo '### Oracle demand wake complete'
            echo '- The shared Oracle VM is RUNNING.'
            echo '- Existing systemd services will start according to their own boot policy.'
            echo '- This workflow does not start a trading session or place orders.'
          } >> "$GITHUB_STEP_SUMMARY"
