name: Deploy Oracle Qwen Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - "deploy/qwen-gateway-version.txt"

permissions:
  contents: read

concurrency:
  group: oracle-qwen-gateway-deploy
  cancel-in-progress: false

env:
  ORACLE_HOST: api.zetbros.com
  ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Ensure Oracle instance is running
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -euo pipefail

          get_state() {
            oci compute instance get \
              --instance-id "$OCI_INSTANCE_OCID" \
              --query 'data."lifecycle-state"' \
              --raw-output
          }

          wait_for_state() {
            local target="$1"
            local timeout_seconds="$2"
            local deadline=$((SECONDS + timeout_seconds))
            local current
            while (( SECONDS < deadline )); do
              current="$(get_state)"
              echo "OCI state while waiting for ${target}: ${current}"
              if [[ "$current" == "$target" ]]; then
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for Oracle to reach ${target}." >&2
            return 1
          }

          start_and_wait() {
            oci compute instance action \
              --instance-id "$OCI_INSTANCE_OCID" \
              --action START \
              --wait-for-state RUNNING \
              --max-wait-seconds 420 \
              --wait-interval-seconds 10 >/dev/null
          }

          state="$(get_state)"
          echo "Current OCI state: $state"
          case "$state" in
            RUNNING)
              ;;
            STARTING)
              wait_for_state RUNNING 420
              ;;
            STOPPED)
              start_and_wait
              ;;
            STOPPING)
              wait_for_state STOPPED 900
              start_and_wait
              ;;
            *)
              echo "Oracle is in unsupported lifecycle state: $state" >&2
              exit 1
              ;;
          esac

      - name: Configure Oracle SSH key
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle

      - name: Wait for SSH
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if ssh -i ~/.ssh/oracle -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" true 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Oracle SSH did not become available" >&2
          exit 1

      - name: Deploy latest Qwen gateway
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" '
            set -euo pipefail
            if [[ ! -d /home/ubuntu/Oracle/.git ]]; then
              git clone https://github.com/Logan17de/Oracle.git /home/ubuntu/Oracle
            fi
            cd /home/ubuntu/Oracle
            git fetch origin main
            git reset --hard origin/main
            sudo bash scripts/install_oracle_service.sh
          '

      - name: Verify gateway service
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" '
            set -euo pipefail
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8788/health; then
                echo
                exit 0
              fi
              sleep 2
            done
            echo "Gateway did not become healthy." >&2
            sudo systemctl --no-pager --full status qwen-api-gateway.service || true
            sudo journalctl -u qwen-api-gateway.service --no-pager -n 80 || true
            exit 1
          '

      - name: Summary
        run: |
          {
            echo '### Qwen gateway deployment complete'
            echo '- Oracle instance is running'
            echo '- Latest Oracle repository main was installed'
            echo '- qwen-api-gateway service was restarted'
            echo '- Local gateway health check passed'
          } >> "$GITHUB_STEP_SUMMARY"
