name: Deploy Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  ORACLE_HOST: ${{ vars.ORACLE_HOST || '193.123.166.128' }}
  ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Check trader pause marker
        id: pause
        shell: bash
        run: |
          if [[ -f .trader-paused ]]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Growing Trader is paused; deploy will preserve disabled services and skip mail provisioning."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Apply pending Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/apply_remote_migrations.sh

      - name: Check for active LIVE position
        id: live
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          count="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.orders where mode='live' and status in ('OPEN','SUBMITTING') and quantity > 0")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Active/unresolved LIVE orders: $count"

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Check Oracle state
        id: oracle
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          state="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Oracle state: $state"

      - name: Configure Oracle SSH key
        if: steps.oracle.outputs.state == 'RUNNING' && steps.live.outputs.count == '0'
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle

      - name: Wait for Oracle SSH readiness
        if: steps.oracle.outputs.state == 'RUNNING' && steps.live.outputs.count == '0'
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            echo "SSH readiness attempt ${attempt}/18"
            if ssh -i ~/.ssh/oracle \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=1 \
              -o StrictHostKeyChecking=accept-new \
              "$ORACLE_USER@$ORACLE_HOST" 'true'; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "Oracle reports RUNNING but SSH did not become ready within the retry window." >&2
            exit 1
          fi

      - name: Install startup email configuration on Oracle
        if: steps.oracle.outputs.state == 'RUNNING' && steps.live.outputs.count == '0' && steps.pause.outputs.paused != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TRADING_REPORT_FROM: ${{ secrets.TRADING_REPORT_FROM }}
        run: |
          set -euo pipefail
          if [[ -z "$RESEND_API_KEY" || -z "$TRADING_REPORT_FROM" ]]; then
            echo "Report email secrets are incomplete; Oracle startup emails will be skipped."
            exit 0
          fi
          python - <<'PY' > /tmp/growing-trader-mail.env
          import os
          import shlex
          for name in ("RESEND_API_KEY", "TRADING_REPORT_FROM"):
              print(f"{name}={shlex.quote(os.environ[name])}")
          PY
          scp -i ~/.ssh/oracle -o StrictHostKeyChecking=accept-new /tmp/growing-trader-mail.env \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/growing-trader-mail.env"
          ssh -i ~/.ssh/oracle -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" '
            set -euo pipefail
            test -f /home/ubuntu/api.env
            umask 077
            tmp="$(mktemp /home/ubuntu/api.env.XXXXXX)"
            grep -v -E "^(RESEND_API_KEY|TRADING_REPORT_TO|TRADING_REPORT_FROM)=" /home/ubuntu/api.env > "$tmp" || true
            cat /tmp/growing-trader-mail.env >> "$tmp"
            mv "$tmp" /home/ubuntu/api.env
            chmod 600 /home/ubuntu/api.env
            rm -f /tmp/growing-trader-mail.env
          '
          rm -f /tmp/growing-trader-mail.env

      - name: Deploy and restart Oracle agent when safe
        if: steps.oracle.outputs.state == 'RUNNING' && steps.live.outputs.count == '0'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            "$ORACLE_USER@$ORACLE_HOST" \
            'cd /home/ubuntu/Growing-Trader && git fetch origin main && git reset --hard origin/main && sudo bash scripts/install_oracle_service.sh'

      - name: Record deferred Oracle deployment
        if: steps.oracle.outputs.state == 'RUNNING' && steps.live.outputs.count != '0'
        run: |
          {
            echo '### Oracle restart deferred'
            echo 'A LIVE order/position is active or unresolved, so GitHub applied the database migration but deliberately did not restart Oracle.'
            echo 'The VM will pull this commit automatically on its next safe boot.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record stopped Oracle state
        if: steps.oracle.outputs.state != 'RUNNING'
        run: |
          {
            echo '### Database deployed; Oracle is currently stopped'
            echo 'No server action is needed. The morning workflow/systemd services will pull the latest main commit on boot.'
          } >> "$GITHUB_STEP_SUMMARY"
