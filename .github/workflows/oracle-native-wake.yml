name: Provision OCI Native Market Wake

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-native-wake.yml"

permissions:
  contents: read

concurrency:
  group: oracle-native-wake-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Create or update OCI-native wake schedules
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -euo pipefail

          compartment_id="$(oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data."compartment-id"' \
            --raw-output)"
          resources="$(python -c 'import json,os; print(json.dumps([{"id": os.environ["OCI_INSTANCE_OCID"]}]))')"

          schedule_state() {
            oci resource-scheduler schedule get \
              --schedule-id "$1" \
              --query 'data."lifecycle-state"' \
              --raw-output
          }

          wait_until_settled() {
            local schedule_id="$1"
            local state=""
            for attempt in $(seq 1 60); do
              state="$(schedule_state "$schedule_id")"
              case "$state" in
                ACTIVE|INACTIVE) echo "$state"; return 0 ;;
                FAILED) echo "OCI Resource Scheduler entered FAILED state" >&2; return 1 ;;
                *) sleep 2 ;;
              esac
            done
            echo "Timed out waiting for OCI Resource Scheduler to settle" >&2
            return 1
          }

          validate_schedule() {
            local schedule_id="$1"
            local expected_name="$2"
            local expected_cron="$3"
            local expected_hour="$4"
            local expected_minute="$5"
            local json_file
            json_file="$(mktemp)"

            # time-next-run is the actual Resource Scheduler field. Poll briefly because
            # OCI may populate it just after an update/activation work request settles.
            for attempt in $(seq 1 20); do
              oci resource-scheduler schedule get \
                --schedule-id "$schedule_id" \
                --output json > "$json_file"
              if python - "$json_file" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1])).get("data", {})
          raise SystemExit(0 if d.get("time-next-run") else 1)
          PY
              then
                break
              fi
              sleep 2
            done

            python - "$json_file" "$expected_name" "$expected_cron" "$expected_hour" "$expected_minute" "$OCI_INSTANCE_OCID" <<'PY'
          import json
          import sys
          from datetime import datetime

          path, expected_name, expected_cron, expected_hour, expected_minute, instance_id = sys.argv[1:]
          d = json.load(open(path)).get("data", {})

          problems = []
          if d.get("display-name") != expected_name:
              problems.append(f"name={d.get('display-name')!r}")
          if d.get("lifecycle-state") != "ACTIVE":
              problems.append(f"state={d.get('lifecycle-state')!r}")
          if d.get("action") != "START_RESOURCE":
              problems.append(f"action={d.get('action')!r}")
          if d.get("recurrence-type") != "CRON":
              problems.append(f"recurrence_type={d.get('recurrence-type')!r}")
          if d.get("recurrence-details") != expected_cron:
              problems.append(f"recurrence={d.get('recurrence-details')!r}")

          next_run = d.get("time-next-run")
          if not next_run:
              problems.append("time-next-run is missing")
          else:
              dt = datetime.fromisoformat(next_run.replace("Z", "+00:00"))
              if (dt.hour, dt.minute) != (int(expected_hour), int(expected_minute)):
                  problems.append(f"next_run={next_run!r} does not match {expected_hour}:{expected_minute} UTC")
              if dt.weekday() >= 5:
                  problems.append(f"next_run={next_run!r} is not a weekday")

          resource_ids = {item.get("id") for item in (d.get("resources") or [])}
          if instance_id not in resource_ids:
              problems.append("target Oracle instance is missing from resources")

          print(
              json.dumps(
                  {
                      "name": d.get("display-name"),
                      "state": d.get("lifecycle-state"),
                      "cron": d.get("recurrence-details"),
                      "time_zone": d.get("local-time-zone"),
                      "last_run": d.get("time-last-run"),
                      "last_run_status": d.get("last-run-status"),
                      "next_run": d.get("time-next-run"),
                  },
                  indent=2,
              )
          )
          if problems:
              raise SystemExit("Invalid OCI wake schedule: " + "; ".join(problems))
          PY
            rm -f "$json_file"
          }

          upsert_schedule() {
            local name="$1"
            local cron="$2"
            local expected_hour="$3"
            local expected_minute="$4"
            local description="$5"
            local existing_json schedule_id state

            existing_json="$(oci resource-scheduler schedule list \
              --compartment-id "$compartment_id" \
              --display-name "$name" \
              --all \
              --output json)"

            schedule_id="$(python -c '
          import json, sys
          payload = json.load(sys.stdin).get("data", [])
          if isinstance(payload, dict):
              payload = payload.get("items", [])
          print(payload[0].get("id", "") if payload else "")
          ' <<<"$existing_json")"

            if [[ -n "$schedule_id" && "$schedule_id" != "null" ]]; then
              echo "Found existing OCI schedule $name: $schedule_id"
              wait_until_settled "$schedule_id" >/dev/null
              echo "Updating OCI Resource Scheduler schedule: $name"
              oci resource-scheduler schedule update \
                --schedule-id "$schedule_id" \
                --action START_RESOURCE \
                --recurrence-type CRON \
                --recurrence-details "$cron" \
                --local-time-zone UTC \
                --resources "$resources" \
                --description "$description" \
                --force \
                --wait-for-state SUCCEEDED \
                --max-wait-seconds 300 >/dev/null
            else
              echo "Creating OCI Resource Scheduler schedule: $name"
              schedule_id="$(oci resource-scheduler schedule create \
                --action START_RESOURCE \
                --compartment-id "$compartment_id" \
                --recurrence-type CRON \
                --recurrence-details "$cron" \
                --local-time-zone UTC \
                --display-name "$name" \
                --description "$description" \
                --resources "$resources" \
                --query 'data.id' \
                --raw-output)"
            fi

            state="$(wait_until_settled "$schedule_id")"
            if [[ "$state" != "ACTIVE" ]]; then
              echo "Activating OCI schedule $name (current state: $state)"
              oci resource-scheduler schedule activate \
                --schedule-id "$schedule_id" \
                --wait-for-state ACTIVE \
                --max-wait-seconds 300 >/dev/null
            fi

            validate_schedule "$schedule_id" "$name" "$cron" "$expected_hour" "$expected_minute"
          }

          # Resource Scheduler uses UTC. Use the weekday spelling from Oracle's
          # documented cron examples and verify the actual computed next run.
          upsert_schedule \
            "GrowingTrader-Weekday-Wake-0830-IST" \
            "0 3 * * mon-fri" \
            "3" \
            "0" \
            "Primary weekday wake for the shared Oracle VM before Growing Trader market observation."

          upsert_schedule \
            "GrowingTrader-Weekday-Wake-0850-IST" \
            "20 3 * * mon-fri" \
            "3" \
            "20" \
            "Guard weekday wake for the shared Oracle VM before the 09:05 IST Growing Trader watcher."

      - name: Summary
        run: |
          {
            echo '### OCI-native market wake verified'
            echo '- Primary wake: 08:30 IST weekdays (03:00 UTC)'
            echo '- Guard wake: 08:50 IST weekdays (03:20 UTC)'
            echo '- Each schedule must be ACTIVE and expose a real time-next-run matching its UTC clock time.'
            echo '- GitHub Oracle Market Start remains a fallback, not the primary market clock.'
          } >> "$GITHUB_STEP_SUMMARY"
