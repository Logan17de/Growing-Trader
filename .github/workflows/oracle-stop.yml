name: Oracle Market Stop

on:
  schedule:
    - cron: "40 15 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-lifecycle
  cancel-in-progress: false

env:
  ORACLE_HOST: ${{ vars.ORACLE_HOST || '193.123.166.128' }}
  ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check trading infrastructure window
        id: trading
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          # Protect the whole infrastructure window, including pre-open startup
          # margin and the post-close watcher/report margin.
          active = now.weekday() < 5 and time(8, 45) <= now.time() < time(15, 40)
          print(f"active={'true' if active else 'false'}")
          print(f"now={now.isoformat()}")
          PY

      - name: Record protected trading window
        if: steps.trading.outputs.active == 'true'
        run: |
          {
            echo '### Oracle shutdown skipped'
            echo 'The shared VM is inside the protected trading infrastructure window (08:45-15:40 Asia/Kolkata).'
            echo 'No trading service or VM shutdown action was taken.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install OCI CLI
        if: steps.trading.outputs.active != 'true'
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        if: steps.trading.outputs.active != 'true'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Check Oracle state
        id: state
        if: steps.trading.outputs.active != 'true'
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          state="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Current OCI state: $state"

      - name: Install PostgreSQL client for lease checks
        if: steps.state.outputs.state == 'RUNNING'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Check Colab Qwen lease
        id: qwen
        if: steps.state.outputs.state == 'RUNNING'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          active="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select exists (
              select 1
              from public.qwen_relay_workers
              where relay_id = 'qwen3-8-27b'
                and status = 'online'
                and updated_at >= now() - interval '90 seconds'
            );
          ")"
          if [[ "$active" == "t" ]]; then active=true; else active=false; fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Colab Qwen lease active: $active"

      - name: Configure Oracle SSH key
        if: steps.state.outputs.state == 'RUNNING'
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle

      - name: Sync Groww daily broker activity
        if: steps.state.outputs.state == 'RUNNING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" '
            cd /home/ubuntu/Growing-Trader
            set -a
            source /home/ubuntu/api.env
            set +a
            .venv/bin/python scripts/sync_groww_daily_activity.py
          ' || echo "Groww daily activity sync failed; shutdown will continue safely and the failure is recorded when possible."

      - name: Stop Groww retry watcher
        if: steps.state.outputs.state == 'RUNNING'
        run: |
          ssh -i ~/.ssh/oracle -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" \
            'sudo systemctl stop growing-trader-market-start || true'

      - name: Safely flatten and stop trading engine
        if: steps.state.outputs.state == 'RUNNING'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" \
            'cd /home/ubuntu/Growing-Trader && set -a && source /home/ubuntu/api.env && set +a && .venv/bin/nifty-engine scheduled-shutdown'
          ssh -i ~/.ssh/oracle -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$ORACLE_USER@$ORACLE_HOST" \
            'sudo systemctl stop growing-trader'

      - name: Verify no unresolved LIVE position remains
        id: live
        if: steps.state.outputs.state == 'RUNNING'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          count="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.orders where mode='live' and status in ('OPEN','SUBMITTING') and quantity > 0")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Active/unresolved LIVE orders after shutdown: $count"

      - name: Keep Oracle online for Colab
        if: steps.state.outputs.state == 'RUNNING' && steps.qwen.outputs.active == 'true'
        run: |
          {
            echo '### Trading stopped; Oracle remains online'
            echo 'The Colab Qwen worker has a fresh Supabase heartbeat, so the VM is being retained for api.zetbros.com.'
            echo 'The idle watchdog will power the VM off later after Colab becomes inactive.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Oracle online for unresolved LIVE position
        if: steps.state.outputs.state == 'RUNNING' && steps.live.outputs.count != '0'
        run: |
          {
            echo '### Oracle power-off vetoed'
            echo 'An unresolved LIVE order/position remains. The VM will not be powered off.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Soft-stop Oracle instance
        if: steps.state.outputs.state == 'RUNNING' && steps.qwen.outputs.active != 'true' && steps.live.outputs.count == '0'
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -euo pipefail
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action SOFTSTOP >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state STOPPED --max-wait-seconds 900 >/dev/null

      - name: Summary
        if: success() && steps.trading.outputs.active != 'true'
        run: |
          {
            echo '### Oracle close automation complete'
            echo '- Trading services were safely closed outside the protected trading window.'
            echo "- Colab active: ${{ steps.qwen.outputs.active || 'false' }}"
            echo "- Unresolved LIVE orders: ${{ steps.live.outputs.count || '0' }}"
            echo '- The VM is powered off only when neither trading nor Colab needs it.'
          } >> "$GITHUB_STEP_SUMMARY"
