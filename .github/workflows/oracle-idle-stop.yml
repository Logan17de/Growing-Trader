name: Oracle Shared VM Idle Stop

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-lifecycle
  cancel-in-progress: false

jobs:
  idle-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check protected trading window
        id: trading
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          active = now.weekday() < 5 and time(8, 45) <= now.time() < time(15, 40)
          print(f"active={'true' if active else 'false'}")
          print(f"now={now.isoformat()}")
          PY

      - name: Keep Oracle for trading window
        if: steps.trading.outputs.active == 'true'
        run: |
          echo "Shared Oracle VM is protected by the trading infrastructure window; no idle stop check is needed."

      - name: Install OCI CLI
        if: steps.trading.outputs.active != 'true'
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI authentication
        if: steps.trading.outputs.active != 'true'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Check Oracle state
        id: state
        if: steps.trading.outputs.active != 'true'
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          state="$(oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --query 'data."lifecycle-state"' --raw-output)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Oracle state: $state"

      - name: Install PostgreSQL client
        if: steps.state.outputs.state == 'RUNNING'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Check Colab heartbeat
        id: qwen
        if: steps.state.outputs.state == 'RUNNING'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          active="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            select exists (
              select 1
              from public.qwen_relay_workers
              where relay_id = 'qwen3-8-27b'
                and status = 'online'
                and updated_at >= now() - interval '90 seconds'
            );
          ")"
          if [[ "$active" == "t" ]]; then active=true; else active=false; fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Colab active: $active"

      - name: Soft-stop idle Oracle instance
        if: steps.state.outputs.state == 'RUNNING' && steps.qwen.outputs.active != 'true'
        env:
          OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -euo pipefail
          echo "No protected trading window and no active Colab lease. Stopping Oracle."
          oci compute instance action --instance-id "$OCI_INSTANCE_OCID" --action SOFTSTOP >/dev/null
          oci compute instance get --instance-id "$OCI_INSTANCE_OCID" --wait-for-state STOPPED --max-wait-seconds 900 >/dev/null

      - name: Keep Oracle for Colab
        if: steps.state.outputs.state == 'RUNNING' && steps.qwen.outputs.active == 'true'
        run: echo "Oracle retained because the Qwen Colab worker has a fresh heartbeat."

      - name: Summary
        if: always()
        run: |
          {
            echo '### Shared Oracle idle check'
            echo "- Trading window active: ${{ steps.trading.outputs.active || 'false' }}"
            echo "- Oracle state before decision: ${{ steps.state.outputs.state || 'not-checked' }}"
            echo "- Colab active: ${{ steps.qwen.outputs.active || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
